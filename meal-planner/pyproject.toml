[project]
name = "meal-agent"
version = "0.1.0"
description = "Chat agent that plans a two-person household's weekly dinners and leftover lunches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10,<3",
    "fastapi>=0.163.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13",
    "uvicorn>=0.30",
]

[project.scripts]
meal-agent = "meal_agent.cli:main"
meal-agent-web = "meal_agent.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Docs hold excerpts of code, indented as they appear in context.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
