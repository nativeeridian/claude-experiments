[project]
name = "meal-agent"
version = "0.1.0"
description = "Chat agent that plans a two-person household's weekly dinners and leftover lunches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.scripts]
meal-agent = "meal_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
